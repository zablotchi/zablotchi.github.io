<header class="masthead">
<div class="masthead-meta">
<a href="{{ '/' | relative_url }}">Zablotchi.com</a>
<span>Distributed systems research</span>
</div>
<div class="masthead-title">
{%- if page.url == "/" %}
<h1 class="site-name">{{ site.title }}</h1>
{%- else %}
<p class="site-name"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
{%- endif %}
<p class="affiliation">{{ site.tagline | capitalize }}<span class="sep" aria-hidden="true">·</span>{{ site.location }}</p>
</div>
</header>
